name: Trailer

# Records the 75 s promotional trailer (MotionLab/Trailer, `-ML_trailer YES`) on an iPhone Pro simulator in both
# canvas aspects and renders it for Xiaohongshu with scripts/record-trailer.sh:
#   9:16 (1080×1920, full-screen video; recommended) and 3:4 (1080×1440), 60 fps.
# Trigger: "[trailer]" in a commit message, or run manually from the Actions tab.
# The trailer's text and voice-over script are read from trailer/copy.json (see docs/TRAILER.md).
# The result (video, preview, 18 keyframes, voiceover.srt / voiceover.txt) is uploaded as the "trailer"
# artifact and committed to docs/trailer/9x16/ and docs/trailer/3x4/ on the same branch.

on:
  push:
  workflow_dispatch:

jobs:
  trailer:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[trailer]')
    runs-on: macos-26
    timeout-minutes: 120
    concurrency:
      group: trailer-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Select Xcode
        run: |
          PICK=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -n 1)
          sudo xcode-select -s "$PICK"
          xcodebuild -version

      - name: Install ffmpeg
        run: brew install ffmpeg >/dev/null

      # On-screen text comes from trailer/copy.json (edit it with tools/trailer-editor.html); the script
      # picks it up automatically and falls back to the built-in defaults if it is missing.
      - name: Record trailer (9:16 and 3:4)
        timeout-minutes: 105
        run: scripts/record-trailer.sh --out out --aspects "9x16 3x4"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trailer
          path: out/
          retention-days: 14

      - name: Commit trailer to docs/trailer/{9x16,3x4}
        run: |
          # Replaces everything under docs/trailer, which also removes the old single-aspect files
          # (docs/trailer/trailer.mp4, trailer-preview.mp4, frames/) in this commit.
          rm -rf docs/trailer
          for ASPECT in 9x16 3x4; do
            mkdir -p "docs/trailer/$ASPECT/frames"
            cp "out/$ASPECT/trailer.mp4" "out/$ASPECT/trailer-preview.mp4" "docs/trailer/$ASPECT/"
            # Voice-over subtitles and script (import the .srt into 剪映 for captions / text-to-speech).
            for EXTRA in voiceover.srt voiceover.txt; do
              if [ -f "out/$ASPECT/$EXTRA" ]; then cp "out/$ASPECT/$EXTRA" "docs/trailer/$ASPECT/"; fi
            done
            cp "out/$ASPECT"/frames/*.png "docs/trailer/$ASPECT/frames/"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/trailer
          git commit -m "Update trailer [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
