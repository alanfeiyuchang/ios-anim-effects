# Optional: regenerate the Xcode project with XcodeGen (`xcodegen generate`).
# The checked-in MotionLab.xcodeproj already works out of the box with Xcode 16+.
name: MotionLab
options:
  bundleIdPrefix: com.motionlexicon
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MotionLab:
    type: application
    platform: iOS
    sources: [MotionLab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motionlexicon.MotionLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Motion Lexicon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
