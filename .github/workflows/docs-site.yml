name: Docs site

# Builds the bilingual documentation site (every effect with a recorded animation loop, plus the interactive
# web demos from web/) and publishes it to GitHub Pages.
# Triggers: "[site]" in a commit message (or a manual run from the Actions tab) re-records every effect;
# "[web]" rebuilds the page and the web demos only, reusing the recordings already published;
# "[media]" records only the effects whose recordings are missing from the published site, then rebuilds.
# Every site build starts from the published recordings, so a shard that fails keeps the previous clips.
# One-time setup: repository Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
  workflow_dispatch:

# Concurrency is per job (not per workflow) so that ordinary pushes, whose jobs are skipped,
# never cancel a site build that is in progress.
jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[site]') || contains(github.event.head_commit.message, '[media]')
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    name: Record shard ${{ matrix.shard }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          PICK=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -n 1)
          sudo xcode-select -s "$PICK"
      - name: Install ffmpeg
        run: brew install ffmpeg >/dev/null
      - name: Record effects
        timeout-minutes: 60
        env:
          ONLY_MISSING_FROM: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[site]') && 'https://alanfeiyuchang.github.io/motionary-ios-animations/media' || '' }}
        run: scripts/record-catalog.sh out ${{ matrix.shard }} 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          retention-days: 3

  site:
    needs: record
    # Publish whatever shards finished; missing clips fall back to posters or placeholders on the page.
    if: ${{ !cancelled() && needs.record.result != 'skipped' }}
    concurrency:
      group: docs-site-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web demos
        working-directory: web
        run: npm ci && npm run build
      - name: Merge shards and build site
        run: |
          mkdir -p media
          cp "$(ls shards/shard-*/catalog.json | head -n 1)" catalog.json
          python3 scripts/mirror_media.py catalog.json media
          for d in shards/shard-*; do cp -R "$d/media/." media/ 2>/dev/null || true; done
          python3 scripts/build_site.py catalog.json media site web/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # "[web]": new web demos or page code without re-recording. The recordings are mirrored from the
  # published site; the catalog is the one exported into web/src/catalog.json.
  web:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[web]') && !contains(github.event.head_commit.message, '[site]') && !contains(github.event.head_commit.message, '[media]')
    concurrency:
      group: docs-site-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web demos
        working-directory: web
        run: npm ci && npm run build
      - name: Mirror published recordings and build site
        run: |
          python3 scripts/mirror_media.py web/src/catalog.json media
          python3 scripts/build_site.py web/src/catalog.json media site web/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
