name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Capture simulator screenshots of every screen and effect"
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: Xcode 16
            xcode: "Xcode_16"
          - runner: macos-26
            name: Xcode 26
            xcode: "Xcode_26"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          PICK=$(ls -d /Applications/${{ matrix.xcode }}*.app | grep -v -i beta | sort -V | tail -n 1)
          echo "Using $PICK"
          sudo xcode-select -s "$PICK"
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project MotionLab.xcodeproj \
            -scheme MotionLab \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            build > build.log 2>&1 || {
              tail -n 30 build.log
              echo "================ COMPILER ERRORS ================"
              grep -E "error:" build.log | sed -E 's#^.*/MotionLab/#MotionLab/#' | sort -u | head -n 300
              exit 1
            }
          echo "================ WARNINGS ================"
          grep -E "warning:" build.log | grep -v appintents | sed -E 's#^.*/MotionLab/#MotionLab/#' | sort -u | head -n 100 || true
          echo "Build succeeded"

  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Select Xcode
        run: |
          PICK=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -n 1)
          sudo xcode-select -s "$PICK"
          xcodebuild -version

      - name: Capture screenshots
        run: PROMPTS=0 scripts/screenshots.sh screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 7

      - name: Commit screenshots to docs/screenshots
        run: |
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp -R screenshots/* docs/screenshots/
          find docs/screenshots -name '*.jpg' -exec sips -Z 900 -s formatOptions 50 {} \; >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update simulator screenshots [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
