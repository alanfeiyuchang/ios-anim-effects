name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Xcode 26 builds on every push. The Xcode 16 compatibility build only runs on demand
  # ("[compat]" in the commit message or a manual run) to save macOS Actions minutes.
  build:
    name: Xcode 26
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: scripts/ci-build.sh Xcode_26

  build-xcode16:
    name: Xcode 16
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[compat]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: scripts/ci-build.sh Xcode_16

  # Simulator screenshots derived from the live catalog (every category and family page, the All
  # Families page, the first variation of every family, zh/en, light/dark; ~30 min):
  # "[shots]" in the commit message or a manual run. EFFECTS=all adds every effect page (much longer).
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Select Xcode
        run: |
          PICK=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -n 1)
          sudo xcode-select -s "$PICK"
          xcodebuild -version

      - name: Capture screenshots
        run: EFFECTS=sample scripts/screenshots.sh screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          retention-days: 7

      - name: Commit screenshots to docs/screenshots
        run: |
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp -R screenshots/* docs/screenshots/
          rm -f docs/screenshots/plan.tsv
          find docs/screenshots -name '*.jpg' -exec sips -Z 900 -s formatOptions 50 {} \; >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update simulator screenshots [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
