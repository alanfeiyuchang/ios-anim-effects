name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Capture simulator screenshots of every screen and effect"
        type: boolean
        default: true

jobs:
  # Xcode 26 builds on every push. The Xcode 16 compatibility build only runs on demand
  # ("[compat]" in the commit message or a manual run) to save macOS Actions minutes.
  build:
    name: Xcode 26
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: scripts/ci-build.sh Xcode_26

  build-xcode16:
    name: Xcode 16
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[compat]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: scripts/ci-build.sh Xcode_16

  screenshots:
        description: "Capture simulator screenshots of every screen and effect"
        type: boolean
        default: true

jobs:
  # Xcode 26 builds on every push. The Xcode 16 compatibility build only runs on demand
  # ("[compat]" in the commit message or a manual run) to save macOS Actions minutes.
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip build]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            name: Xcode 26
            xcode: "Xcode_26"
            always: true
          - runner: macos-15
            name: Xcode 16
            xcode: "Xcode_16"
            always: false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      RUN_THIS: ${{ matrix.always || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[compat]') }}
    steps:
      - name: Skip note
        if: env.RUN_THIS != 'true'
        run: echo "Xcode 16 compatibility build skipped (add [compat] to the commit message to run it)."

      - uses: actions/checkout@v4
        if: env.RUN_THIS == 'true'

      - name: Select Xcode
        if: env.RUN_THIS == 'true'
        run: |
          PICK=$(ls -d /Applications/${{ matrix.xcode }}*.app | grep -v -i beta | sort -V | tail -n 1)
          echo "Using $PICK"
          sudo xcode-select -s "$PICK"
          xcodebuild -version

      - name: Build for iOS Simulator
        if: env.RUN_THIS == 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project MotionLab.xcodeproj \
            -scheme MotionLab \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            build > build.log 2>&1 || {
              tail -n 30 build.log
              echo "================ COMPILER ERRORS ================"
              grep -E "error:" build.log | sed -E 's#^.*/MotionLab/#MotionLab/#' | sort -u | head -n 300
              exit 1
            }
          echo "================ WARNINGS ================"
          grep -E "warning:" build.log | grep -v appintents | sed -E 's#^.*/MotionLab/#MotionLab/#' | sort -u | head -n 100 || true
          echo "Build succeeded"

  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Select Xcode
        run: |
          PICK=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -n 1)
          sudo xcode-select -s "$PICK"
          xcodebuild -version

      - name: Capture screenshots
        run: PROMPTS=0 scripts/screenshots.sh screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 7

      - name: Commit screenshots to docs/screenshots
        run: |
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp -R screenshots/* docs/screenshots/
          find docs/screenshots -name '*.jpg' -exec sips -Z 900 -s formatOptions 50 {} \; >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update simulator screenshots [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
